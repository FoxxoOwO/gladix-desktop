name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v1.4.6'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  # The tag, the version in AppVersion and the packaged image must agree,
  # otherwise the update check would offer a version this build is not.
  version:
    name: Check the tag against AppVersion
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        shell: bash
        run: |
          ref='${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}'
          version="${ref#v}"
          file=desktop/src/main/kotlin/dev/gladix/desktop/core/AppVersion.kt
          declared=$(grep -oP 'const val NAME = "\K[^"]+' "$file" || true)
          [ -n "$declared" ] || { echo "AppVersion.NAME not found in $file" >&2; exit 1; }
          [ "$declared" = "$version" ] || {
            echo "Tag '$ref' says $version but AppVersion says $declared" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$ref" >> "$GITHUB_OUTPUT"
          echo "Building Gladix $version from $ref"

  # A jpackage app image can only be built on its own OS, so every platform
  # gets its own runner and the same ZIP shape as Windows.
  build:
    name: Build ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            launcher: Gladix/Gladix.exe
          - os: ubuntu-latest
            label: linux-x64
            launcher: Gladix/bin/Gladix
          - os: macos-latest
            label: macos-arm64
            launcher: Gladix.app/Contents/MacOS/Gladix
          # macos-13 was retired in Dec 2025; macos-15-intel is the x86_64 label.
          - os: macos-15-intel
            label: macos-x64
            launcher: Gladix.app/Contents/MacOS/Gladix
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Run the self-check
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then ./gradlew.bat :desktop:selfCheck --console=plain
          else sh ./gradlew :desktop:selfCheck --console=plain; fi

      - name: Build the app image
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then ./gradlew.bat :desktop:createDistributable --console=plain
          else sh ./gradlew :desktop:createDistributable --console=plain; fi

      - name: Pack the image
        shell: bash
        env:
          ZIP: Gladix-${{ needs.version.outputs.version }}-${{ matrix.label }}.zip
        run: |
          cd desktop/build/compose/binaries/main/app
          echo "packing $(pwd) -> $GITHUB_WORKSPACE/$ZIP (zip at: $(command -v zip || echo missing))"
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -NoProfile -Command "Compress-Archive -Path (Join-Path (Get-Location) '*') -DestinationPath (Join-Path \$env:GITHUB_WORKSPACE \$env:ZIP) -Force"
          else
            # python's zipfile keeps the executable bits the launchers need.
            python3 - "$GITHUB_WORKSPACE/$ZIP" <<'PY'
          import os, sys, zipfile
          with zipfile.ZipFile(sys.argv[1], "w", zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk("."):
                  for name in dirs + files:
                      p = os.path.relpath(os.path.join(root, name), ".")
                      z.write(p, p)
          PY
          fi
          ls -l "$GITHUB_WORKSPACE/$ZIP"

      - name: Check the launcher is inside the ZIP
        shell: bash
        env:
          ZIP: Gladix-${{ needs.version.outputs.version }}-${{ matrix.label }}.zip
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            unzip -l "$ZIP" | grep -q 'Gladix/Gladix.exe' || { echo "no Gladix.exe in $ZIP" >&2; exit 1; }
          else
            unzip -l "$ZIP" | grep -q '${{ matrix.launcher }}' || {
              echo "no ${{ matrix.launcher }} in $ZIP" >&2; exit 1; }
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: Gladix-${{ needs.version.outputs.version }}-${{ matrix.label }}.zip
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The committed notes carry a placeholder line; the published text has to
      # name the artefacts that are actually uploaded.
      - name: Put the real hashes into the release notes
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notes="release/notes-$VERSION.md"
          [ -f "$notes" ] || {
            echo "Missing $notes - add the release notes to the release commit first." >&2; exit 1; }
          (cd dist && sha256sum *.zip | sort -k2) > hashes.txt
          awk 'BEGIN { while ((getline line < "hashes.txt") > 0) block = block line "\n" }
               /^SHA-256/ { printf "SHA-256\n%s", block; next } { print }' "$notes" > notes.tmp
          mv notes.tmp "$notes"
          cat hashes.txt

      - name: Upload the assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notes="release/notes-$VERSION.md"
          if gh release view "$TAG" --json tagName > /dev/null 2>&1; then
            echo "Release $TAG exists - replacing its notes and assets"
            gh release upload "$TAG" dist/*.zip --clobber
            gh release edit "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" dist/*.zip --verify-tag \
              --title "Gladix Desktop $VERSION" --notes-file "$notes"
          fi
          gh release view "$TAG" --json tagName,assets \
            --jq '.tagName + " -> " + ([.assets[].name] | join(", "))'
