name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v1.4.4'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the Windows ZIP
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The tag, the version in AppVersion and the packaged image must agree,
      # otherwise the update check would offer a version this build is not.
      - name: Check the tag against AppVersion
        shell: pwsh
        run: |
          $ref = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          $version = $ref.TrimStart('v')
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=$ref" >> $env:GITHUB_ENV

          $file = 'desktop/src/main/kotlin/dev/gladix/desktop/core/AppVersion.kt'
          $m = Select-String -Path $file -Pattern 'const val NAME = "([^"]+)"'
          if (-not $m) { throw "AppVersion.NAME not found in $file" }
          $declared = $m.Matches[0].Groups[1].Value
          if ($declared -ne $version) {
            throw "Tag '$ref' says $version but AppVersion says $declared"
          }
          Write-Host "Building Gladix $version from $ref"

      - name: Run the self-check
        run: ./gradlew.bat :desktop:selfCheck --console=plain

      - name: Build the app image
        run: ./gradlew.bat :desktop:createDistributable --console=plain

      - name: Pack the image and hash it
        shell: pwsh
        run: |
          $zip = "Gladix-$env:VERSION-windows-x64.zip"
          $image = 'desktop/build/compose/binaries/main/app/Gladix'
          if (-not (Test-Path (Join-Path $image 'Gladix.exe'))) {
            throw "$image does not contain Gladix.exe"
          }
          Compress-Archive -Path $image -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "ZIP=$zip" >> $env:GITHUB_ENV
          "SHA256=$hash" >> $env:GITHUB_ENV
          $size = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "$zip - $size MB - SHA-256 $hash"

      # The committed notes carry the hash of whoever built the ZIP first; the
      # published text has to name the artefact that is actually uploaded.
      - name: Put the real hash into the release notes
        shell: pwsh
        run: |
          $notes = "release/notes-$env:VERSION.md"
          if (-not (Test-Path $notes)) {
            throw "Missing $notes - add the release notes to the release commit first."
          }
          $text = Get-Content $notes -Raw
          if ($text -match '(?m)^SHA-256\s') {
            $text = [regex]::Replace($text, '(?m)^SHA-256\s+\S+', "SHA-256  $env:SHA256")
          } else {
            $text = $text.TrimEnd() + "`n`nSHA-256  $env:SHA256`n"
          }
          Set-Content -Path $notes -Value $text -NoNewline -Encoding utf8
          "NOTES=$notes" >> $env:GITHUB_ENV

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:TAG --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:TAG exists - replacing its notes and asset"
            gh release upload $env:TAG $env:ZIP --clobber
            gh release edit $env:TAG --notes-file $env:NOTES
          } else {
            gh release create $env:TAG $env:ZIP --verify-tag --title "Gladix Desktop $env:VERSION" --notes-file $env:NOTES
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing $env:TAG failed" }
          gh release view $env:TAG --json tagName,assets --jq '.tagName + " -> " + ([.assets[].name] | join(", "))'
