name: live check

# Talks to Deezer for real with a throwaway account, so it runs on a schedule
# instead of on every push. A red run means the gateway or the API changed.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: live check
        env:
          GLADIX_USER_JSON: ${{ secrets.GLADIX_USER_JSON }}
        run: |
          set -o pipefail
          sh ./gradlew :desktop:liveCheck --console=plain | tee live.log
          # liveCheck exits 1 on its own failures; this catches a missing secret.
          if grep -q 'liveCheck skipped' live.log; then
            echo '::error::GLADIX_USER_JSON is missing or no longer signed in'
            exit 1
          fi

      - name: upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-check-log
          path: live.log
          if-no-files-found: warn
